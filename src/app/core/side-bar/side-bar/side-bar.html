<mat-toolbar class="mat-elevation-z8">
  <button
    mat-icon-button
    *ngIf="sidenav.mode === 'over'"
    (click)="sidenav.toggle()">
    <mat-icon *ngIf="!sidenav.opened"> menu </mat-icon>
    <mat-icon *ngIf="sidenav.opened"> close </mat-icon>
  </button>
  Challenges App
  <div class="display-right">
    <button mat-button class="logout-button">
        <mat-icon style="color: white;margin-right: 8px;">output</mat-icon>
        <span>Logout</span>
    </button>
  </div>
</mat-toolbar>

<mat-sidenav-container>
  <mat-sidenav #sidenav="matSidenav" class="mat-elevation-z8">

    <mat-divider></mat-divider>

    <button mat-button class="menu-button" routerLink="/challenges">
      <mat-icon>person</mat-icon>
      <span>Challenges</span>
    </button>
    <button mat-button class="menu-button" routerLink="/leader-board">
      <mat-icon>app_registration</mat-icon>
      <span>Leaders Board</span>
    </button>
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="content mat-elevation-z8">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
