<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
  <p>Loading...</p>
</div>

<div *ngIf="!loading && leadersBoard.length === 0" class="empty-state">
  <mat-icon>inbox</mat-icon>
  <p>No items to display</p>
</div>

<div *ngIf="!loading && leadersBoard.length > 0">
  <table mat-table [dataSource]="leadersBoard">
    <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let element">
            {{ element.userAlias }} 
        </td>
    </ng-container>
    <ng-container matColumnDef="score">
        <th mat-header-cell *matHeaderCellDef>Score</th>
        <td mat-cell *matCellDef="let element">
            {{ element.totalScore }} 
        </td>
    </ng-container>    
    <ng-container matColumnDef="badges">
      <th mat-header-cell *matHeaderCellDef>Badges</th>
      <td mat-cell *matCellDef="let element">
        <mat-chip-set *ngIf="element.badges?.length" aria-label="Badges">
          <mat-chip *ngFor="let b of element.badges; let i = index" selectable="false" removable="false">
            {{ b }}
          </mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="pageSizeOptions" 
               [showFirstLastButtons]="true" 
               [pageSize]="pageSize">
  </mat-paginator>
</div>
