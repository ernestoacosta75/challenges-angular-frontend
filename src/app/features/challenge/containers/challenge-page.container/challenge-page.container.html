<mat-toolbar color="primary">
  <span class="spacer"></span>
  <button mat-icon-button aria-label="Add" *ngIf="!editing" (click)="onCreate()">
    <mat-icon style="color: white;margin-right: 8px;">add_circle</mat-icon>
    <span>New challenge</span>
  </button>    
</mat-toolbar>

<ng-container *ngIf="editing">
    <mat-card>
        <mat-card-header>
            <mat-card-title>{{ editing.id ? 'Challenge Data' : 'New Challenge' }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <app-challenge-editor
                [challenge]="editing"
                (save)="onSave($event)"
                (cancel)="onCancel()"></app-challenge-editor>
        </mat-card-content>
    </mat-card>
</ng-container>

<div class="page mat-typography" fxLayout="column" fxLayoutGap="16px" style="padding:16px;">
    <app-challenges-list
        [attempts]="(allAttempts$ | async) || []"
        [loading]="(loading$ | async) || false"
        (rowClicked)="onRowClick($event)"
        (delete)="onDelete($event)"></app-challenges-list>
</div>
