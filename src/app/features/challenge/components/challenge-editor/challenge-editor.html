<div class="challenge-editor-wrapper">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="challenge-editor">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Factor A</mat-label>
            <input matInput id="factorA" formControlName="factorA"/>
        </mat-form-field>        
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Factor B</mat-label>
            <input matInput id="factorB" formControlName="factorB"/>
        </mat-form-field>        
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Alias</mat-label>
            <input matInput id="alias" formControlName="alias" required />
            <mat-error *ngIf="alias.invalid && (alias.dirty || alias.touched)">Alias is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Guess</mat-label>
            <input matInput id="guess" formControlName="guess" required />
            <mat-error *ngIf="guess.invalid && (guess.dirty || guess.touched)">Guess is required</mat-error>
        </mat-form-field>    
        <div class="actions">
        <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">
            <mat-progress-spinner *ngIf="saving" mode="indeterminate" diameter="18"></mat-progress-spinner>
            <span *ngIf="!saving">Save</span>
        </button>
        </div>            
    </form>
</div>
