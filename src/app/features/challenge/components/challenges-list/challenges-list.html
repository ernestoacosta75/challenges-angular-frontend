<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
  <p>Loading...</p>
</div>

<div *ngIf="!loading && challenges.length === 0" class="empty-state">
  <mat-icon>inbox</mat-icon>
  <p>No items to display</p>
</div>

<div *ngIf="!loading && challenges.length > 0">
  <table mat-table [dataSource]="challenges">
    <ng-container matColumnDef="factorA">
        <th mat-header-cell *matHeaderCellDef>Factor A</th>
        <td mat-cell *matCellDef="let element">
            {{ element.factorA }} 
        </td>
    </ng-container>
    <ng-container matColumnDef="factorB">
        <th mat-header-cell *matHeaderCellDef>Factor B</th>
        <td mat-cell *matCellDef="let element">
            {{ element.factorB }} 
        </td>
    </ng-container>
    <ng-container matColumnDef="result">
        <th mat-header-cell *matHeaderCellDef>Result</th>
        <td mat-cell *matCellDef="let element">
            {{ element.factorA }} * {{ element.factorB }}
        </td>
    </ng-container>
    <ng-container matColumnDef="guess">
        <th mat-header-cell *matHeaderCellDef>Guess</th>
        <td mat-cell *matCellDef="let element">
            {{ element.guess }} 
        </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="warn" 
              aria-label="Delete challenge"
              (click)="onDeleteRow($event, element)">
              <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="onRowClicked(row)"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="pageSizeOptions" 
               [showFirstLastButtons]="true" 
               [pageSize]="pageSize">
  </mat-paginator>
</div>
